name = "porra-fortilin-app"
main = "workers/app.ts"
compatibility_date = "2026-06-11"

[[d1_databases]]
binding = "DB"
database_name = "porra-fortilin"
database_id = "9b01ada1-d9ce-480e-a223-a3f96b69a3ee"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
APP_NAME = "Porra Fortilin"
LEAGUE_NAME = "Fortilin"
OPENLIGADB_BASE_URL = "https://api.openligadb.de"
OPENLIGADB_LEAGUE_SHORTCUT = "wm26"
OPENLIGADB_SEASON = "2026"
